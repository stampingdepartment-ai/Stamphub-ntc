<!DOCTYPE html>
<html lang="id" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stamphub-Ntc — Laporan Produksi Stamping</title>
<meta name="google" content="notranslate">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#14b8a6">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<style>
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background:#0e1113; color:#e7e9ea;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    display:flex; align-items:center; justify-content:center; min-height:100vh;
    text-align:center;
  }
  .wrap{ padding:24px; max-width:340px; }
  img.logo{ width:120px; border-radius:10px; margin-bottom:18px; }
  h1{ font-size:19px; margin:0 0 8px; }
  p{ color:#9aa2a8; font-size:13px; margin:0 0 22px; line-height:1.5; }
  .btn{
    display:block; width:100%; box-sizing:border-box; padding:14px; border-radius:10px;
    border:none; font-size:15px; font-weight:700; cursor:pointer; margin-bottom:10px;
    text-decoration:none;
  }
  .btn-primary{ background:#2dd4bf; color:#06201c; }
  .btn-install{ background:#1d2126; color:#e7e9ea; border:1px solid #2a2f34; display:none; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Stamphub-Ntc</h1>
    <p>One Platform for All Stamping Data<br>PT Nusa Toyotetsu Corp</p>

    <!-- Tombol Install ini baru muncul kalau browser-nya mendeteksi halaman ini
         "installable" (manifest + service worker valid). Kalau tombolnya tidak
         muncul, biasanya browser tetap punya opsi "Install app" / "Add to Home
         Screen" di menu titik tiga (⋮) di pojok kanan atas. -->
    <button class="btn btn-install" id="installBtn" type="button">⬇ Install Aplikasi</button>

    <a class="btn btn-primary" id="openAppLink" href="#">Buka Aplikasi</a>
  </div>

  <script>
    var EXEC_URL = "https://script.google.com/macros/s/AKfycbwCJy7nttB731S_pJiAUfY6XUvXMAWW8fYaoIKJpZuFhE8RyxlR-nk2RKcwlfPOccnbjg/exec";
    document.getElementById('openAppLink').href = EXEC_URL;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(function(){});
    }

    // Tangkap event install PWA dari browser, tampilkan tombol "Install Aplikasi"
    // sendiri kalau memang tersedia (ini TIDAK selalu muncul di semua browser/kondisi
    // -- itu wajar, tombol "Buka Aplikasi" di bawahnya tetap selalu bisa dipakai).
    var deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e){
      e.preventDefault();
      deferredInstallPrompt = e;
      document.getElementById('installBtn').style.display = 'block';
    });
    document.getElementById('installBtn').addEventListener('click', function(){
      if(!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      deferredInstallPrompt.userChoice.finally(function(){
        deferredInstallPrompt = null;
        document.getElementById('installBtn').style.display = 'none';
      });
    });
  </script>
</body>
</html>
