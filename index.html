<!DOCTYPE html>
<html lang="id" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stamphub-Ntc — Laporan Produksi Stamping</title>
<meta name="google" content="notranslate">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#14b8a6">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<style>
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background:#0e1113; color:#e7e9ea;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    display:flex; align-items:center; justify-content:center; min-height:100vh;
    text-align:center;
  }
  .wrap{ padding:24px; }
  img.logo{ width:120px; border-radius:10px; margin-bottom:18px; }
  h1{ font-size:18px; margin:0 0 8px; }
  p{ color:#9aa2a8; font-size:13px; margin:0 0 20px; }
  .spinner{
    width:28px; height:28px; margin:0 auto 18px;
    border:3px solid rgba(45,212,191,.25); border-top-color:#2dd4bf; border-radius:50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  a.manual-link{ color:#2dd4bf; font-size:13px; text-decoration:none; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <h1>Stamphub-Ntc</h1>
    <p>Membuka aplikasi...</p>
    <a class="manual-link" id="manualLink" href="#">Kalau tidak otomatis terbuka, klik di sini</a>
  </div>

  <script>
    // Link exec Apps Script yang SEBENARNYA menjalankan aplikasi. Ganti nilai ini kalau
    // suatu saat deployment Apps Script-nya benar-benar ganti URL (jarang terjadi selama
    // selalu pakai "New version", bukan bikin deployment baru).
    var EXEC_URL = "https://script.google.com/macros/s/AKfycbwCJy7nttB731S_pJiAUfY6XUvXMAWW8fYaoIKJpZuFhE8RyxlR-nk2RKcwlfPOccnbjg/exec";

    document.getElementById('manualLink').href = EXEC_URL;

    // Daftarkan service worker DULU (supaya browser sempat menganggap halaman ini installable
    // sebagai PWA) sebelum redirect ke aplikasi aslinya. Service worker ini "polos" -- tidak
    // menyimpan cache apa pun, cuma syarat teknis biar tombol Install muncul.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(function(){ /* diamkan kalau gagal, tetap lanjut redirect */ });
    }

    // Kasih jeda sedikit (600ms) supaya manifest+service worker sempat "kebaca" browser
    // sebelum pindah halaman, baru redirect ke aplikasi aslinya di Apps Script.
    setTimeout(function(){
      window.location.replace(EXEC_URL);
    }, 600);
  </script>
</body>
</html>
